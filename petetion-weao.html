<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Petition: Remove @whydoiexist Image Perms</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; background: #f8f8f8; text-align: center; }
    .petition-container { background: #fff; margin: 60px auto; padding: 2em; border-radius: 10px; box-shadow: 0 4px 16px #0002; width: 100%; max-width: 400px;}
    h1 { font-size: 1.7rem; }
    #counter { color: #2d9442; font-size: 2.2rem; margin: 0.5em 0; }
    .byline { color: #777; font-size: 0.95em; }
    button { background: #2d9442; color: #fff; font-size: 1.1em; border: none; padding: 0.6em 1.8em; border-radius: 5px; cursor: pointer; margin-top: 1em; }
    button:active { background: #236c32; }
    .thanks { color: #218838; font-weight: bold; margin-top: 1em; }
  </style>
</head>
<body>
  <div class="petition-container">
    <h1>Remove @whydoiexist Image Perms</h1>
    <p>Sign the petition to remove @whydoiexist's image permissions!</p>
    <div id="counter">0</div>
    <form id="signForm" autocomplete="off">
      <input type="text" id="username" placeholder="Your name or @handle (optional)" maxlength="32" style="padding:0.5em; width: 80%; border-radius: 4px; border:1px solid #ccc;">
      <br>
      <button type="submit">Sign Petition</button>
    </form>
    <div class="thanks" style="display:none;">Thank you for signing!</div>
    <div class="byline">This page is for demonstration only.</div>
  </div>

  <script>
    // --- Config: initial count and "start time" ---
    const petitionStartTimestamp = new Date('2024-05-01T00:00:00Z').getTime(); 
    const baseCount = 79; 

    
    function getSimulatedCount() {
      const now = Date.now();
      const minutesElapsed = Math.floor((now - petitionStartTimestamp) / 60000);

      
      let simulatedVotes = 0;
      let t = 0;
      let lastVoteTime = petitionStartTimestamp;
      while (lastVoteTime < now) {
        const nextGap = Math.floor(Math.random() * 19) + 2; 
        lastVoteTime += nextGap * 60000;
        if (lastVoteTime > now) break;
        simulatedVotes += Math.floor(Math.random() * 2) + 1; 
        t++;
        
      }
      return baseCount + simulatedVotes;
    }

    
    function mulberry32(a) {
      return function() {
        var t = a += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      }
    }
    function getDeterministicCount() {
      const now = Date.now();
      let simulatedVotes = 0;
      let lastVoteTime = petitionStartTimestamp;
      let seed = Math.floor((petitionStartTimestamp / 1000) % 1000000);
      const rng = mulberry32(seed);
      while (lastVoteTime < now) {
        const nextGap = Math.floor(rng() * 19) + 2; 
        lastVoteTime += nextGap * 60000;
        if (lastVoteTime > now) break;
        simulatedVotes += Math.floor(rng() * 2) + 1; 
      }
      
      const localSignatures = Number(localStorage.getItem('signedPetition') || 0);
      return baseCount + simulatedVotes + localSignatures;
    }

    
    function updateCounter() {
      document.getElementById('counter').textContent = getDeterministicCount();
    }
    updateCounter();

    
    setInterval(updateCounter, 10000);

    document.getElementById('signForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      if (localStorage.getItem('hasSignedPetition')) return;
      localStorage.setItem('hasSignedPetition', '1');
      
      if (document.getElementById('username').value.trim().length > 0) {
        localStorage.setItem('signedPetitionUser', document.getElementById('username').value.trim());
      }
      
      let count = Number(localStorage.getItem('signedPetition') || 0);
      localStorage.setItem('signedPetition', count + 1);
      updateCounter();
      document.querySelector('.thanks').style.display = "";
      document.getElementById('signForm').style.display = "none";
    });

    
    if (localStorage.getItem('hasSignedPetition')) {
      document.querySelector('.thanks').style.display = "";
      document.getElementById('signForm').style.display = "none";
    }
  </script>
</body>
</html>
